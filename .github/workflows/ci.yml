name: CI and demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install chromium
      - name: Python, browser and lifecycle checks
        run: |
          python -m pytest -q
          python verify_lifecycle.py
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check demo/demo.js
      - name: Build static demo
        run: python scripts/build_demo.py _site
      - name: Build production image
        run: docker build -t wichtelwerk:ci .
      - name: Exercise isolated production image
        run: |
          docker run -d --name wichtelwerk-ci --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 256m --cpus 1 --tmpfs /tmp:rw,size=32m,mode=1777 \
            --tmpfs /data:rw,size=32m,uid=10001,gid=10001,mode=0700 wichtelwerk:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' wichtelwerk-ci)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs wichtelwerk-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm -f wichtelwerk-ci || true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/english-docker')
        with:
          path: _site

  container:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/english-docker')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$image:edge" -t "$image:sha-${GITHUB_SHA}" .
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:edge"
      - name: Log out of registry
        if: always()
        run: docker logout ghcr.io

  demo:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/english-docker')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
